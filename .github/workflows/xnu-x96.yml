name: XNU X96SC2 P0

on:
  workflow_dispatch:

concurrency:
  group: xnu-x96sc2-p0
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: X96SC2

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned build harness
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp out/source/0001-x96sc2-add-single-core-XNU-P0-target-with-GICv2.patch \
             dxb/patches/0000-x96sc2-p0.patch
          cp out/source/0002-x96sc2-add-firmware-configured-uart-console.patch \
             dxb/patches/0001-x96sc2-uart.patch
          cp out/source/0003-x96sc2-enable-mockfs-RAM-disk-root-for-QEMU.patch \
             dxb/patches/0002-x96sc2-mockfs.patch
          cp out/source/0004-stage-x96sc2-libpthread.sh \
             dxb/patches/0003-x96sc2-libpthread-stage.sh
          cp out/source/0004-x96sc2-link-matching-libpthread-kernel-provider.patch \
             dxb/patches/0003-x96sc2-libpthread.patch
          sed -i '' \
            's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' \
            dxb/build.sh

      - name: Select Xcode 16.2 toolchain
        run: |
          brew install jq gum bash cmake ninja
          XC=/Applications/Xcode_16.2.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build DEVELOPMENT_ARM64_X96SC2
        working-directory: dxb
        env:
          MAKEFLAGS: -k
        run: bash build.sh

      - name: Collect kernel and generated build context
        if: always()
        run: |
          mkdir -p artifacts/kernel
          cp -R dxb/fakeroot/System/Library/Kernels/. artifacts/kernel/ 2>/dev/null || true
          if test -d dxb/build/xnu.obj; then
            tar czf artifacts/x96sc2-build-context.tgz \
              --exclude='*.o' --exclude='*.cpo' --exclude='*.a' \
              --exclude='*.dSYM' --exclude='*.unstripped' \
              --exclude='kernel.development.*' --exclude='.git' \
              -C dxb build/xnu.obj fakeroot/usr/local/include xnu
          else
            tar czf artifacts/x96sc2-patched-source.tgz \
              --exclude='.git' -C dxb xnu
          fi
          find artifacts -maxdepth 2 -type f -print

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-x96sc2-p0
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
